<!doctype html><html><head><meta charset="utf-8"><title>PHN Wallet</title><style>body{font-family:Inter,Segoe UI,sans-serif;background:#f7fbff;color:#0c1930;margin:0}main{max-width:860px;margin:auto;padding:40px 20px}.card{background:white;border:1px solid rgba(28,78,120,.12);border-radius:24px;padding:24px;margin-top:16px}button{padding:14px 18px;border:0;border-radius:999px;background:#356dff;color:#fff}.row{display:flex;justify-content:space-between;margin-top:12px}</style></head><body><main><h1>PHN Wallet</h1><button id="connect">Connect MetaMask</button><div class="card"><div class="row"><span>Address</span><span id="address">Not connected</span></div><div class="row"><span>PEAQ</span><span id="peaq">—</span></div><div class="row"><span>PHN</span><span id="phn">—</span></div></div></main><script type="module">import{BrowserProvider,Contract,formatEther,formatUnits}from"https://cdn.jsdelivr.net/npm/ethers@6.13.5/+esm";const PHN="0x83e2A4aB24A61d138f12569c497C3E5f2BF8694B",abi=["function balanceOf(address) view returns (uint256)"],$=id=>document.getElementById(id);$("connect").onclick=async()=>{if(!window.ethereum)return alert("MetaMask not detected");const p=new BrowserProvider(window.ethereum),[a]=await p.send("eth_requestAccounts",[]);$("address").textContent=a;$("peaq").textContent=`${formatEther(await p.getBalance(a))} PEAQ`;$("phn").textContent=`${formatUnits(await new Contract(PHN,abi,p).balanceOf(a),18)} PHN`;};</script></body></html>
