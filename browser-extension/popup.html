<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; margin: 0; padding: 18px; background:#06101c; color:#eef5ff; font-family:Segoe UI,sans-serif; }
    h1 { font-size:20px; margin-top:0; }
    p { color:#9eb0c7; }
    button { width:100%; margin-top:10px; padding:10px; border:0; border-radius:999px; font-weight:700; }
    #start { background:#73f5d3; color:#03111d; }
    #heartbeat, #claim { background:transparent; color:#eef5ff; border:1px solid rgba(127,177,255,.22); }
    .row { display:flex; justify-content:space-between; margin-top:10px; color:#9eb0c7; }
  </style>
</head>
<body>
  <h1>PHN Community Node</h1>
  <p>Run a lightweight verified browser node and track contribution rewards.</p>
  <div class="row"><span>Status</span><span id="status">offline</span></div>
  <div class="row"><span>Heartbeats</span><span id="heartbeats">0</span></div>
  <div class="row"><span>Rewards</span><span id="rewards">0 PHN</span></div>
  <button id="start">Start node</button>
  <button id="heartbeat">Send heartbeat</button>
  <button id="claim">Claim rewards</button>
  <script src="popup.js"></script>
</body>
</html>
